<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Lyspult Bagscenen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mørk teaterpult i ét skærmbillede — lamperække (tryk = patch), sidevalg, 20 kanalknapper pr. side, master til højre */
:root{
  --bg:#0d0f12; --panel:#1a1e24; --key:#262b33; --key-edge:#3a414c;
  --ink:#e8ebef; --dim:#7d8693; --warm:#ffd79a; --pink:#ff5fb4; --led:#4aa3ff; --red:#ff3b30; --alarm:#2a0606; --ok:#3ddc84;
  --f-key:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
@supports (height:100dvh){.desk{height:100dvh}}
.screen{cursor:pointer}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-key);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
.desk{box-sizing:border-box;height:100%;padding-block:2.2vh;padding-inline:max(16px,2.4vw);
  display:grid;grid-template-rows:auto auto 1fr auto;gap:2vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-weight:700;letter-spacing:.18em;font-size:clamp(14px,1.8vw,22px);color:var(--dim);padding:8px 12px 8px 0;cursor:default}
.screen{font-family:var(--f-mono);font-size:clamp(11px,1.4vw,18px);color:var(--led);background:#05080c;border:1px solid var(--key-edge);
  border-radius:6px;padding:8px 14px;display:flex;gap:2em;white-space:nowrap;overflow:hidden;min-width:0}
.screen span{color:var(--dim)}
#msg{min-width:20ch}
#msg.warn{color:var(--red)} #msg.ok{color:var(--ok)}
.rig{background:var(--panel);border-radius:10px;padding:2vh 1.6vw;display:grid;
  grid-template-columns:repeat(13,minmax(0,1fr));gap:1vw;align-items:end}
.lamp{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:.6vh;cursor:pointer}
.bulb{width:min(5.2vw,9vh);aspect-ratio:1;max-width:100%;border-radius:50%;background:#14171c;border:2px solid #2c323b;
  transition:background .25s, box-shadow .25s}
.lamp.on .bulb{background:var(--warm);box-shadow:0 0 1.6vw .2vw rgba(255,215,154,.55)}
.lamp.pink .bulb{background:var(--pink);box-shadow:0 0 2vw .5vw rgba(255,95,180,.7)}
.lamp.dead .bulb{background:repeating-linear-gradient(45deg,#1b1f25 0 6px,#23282f 6px 12px);border-style:dashed}
.lamp b{font-size:clamp(16px,2.6vw,36px);color:var(--ink);font-weight:700;line-height:1}
.lamp i{font-style:normal;font-family:var(--f-mono);font-size:clamp(9px,1.05vw,15px);color:var(--dim);white-space:nowrap}
.lamp.pink i{color:var(--pink)}
.lamp.pop .bulb{animation:lamppop .6s ease-out 1}
@keyframes lamppop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2vw;min-height:0}
.left{display:grid;grid-template-rows:auto 1fr;gap:1.4vh;min-height:0}
.pager{display:flex;align-items:center;gap:1vw;font-family:var(--f-mono);font-size:clamp(12px,1.4vw,18px);color:var(--dim)}
.pg{appearance:none;border:2px solid var(--key-edge);border-radius:8px;background:var(--key);color:var(--ink);
  font-family:var(--f-key);font-weight:700;font-size:clamp(16px,2vw,26px);width:clamp(44px,6vw,80px);height:clamp(36px,5vh,52px)}
#pageLbl b{color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:1fr;gap:1.2vw;min-height:0}
.key{appearance:none;border:2px solid var(--key-edge);border-radius:10px;background:var(--key);color:var(--ink);
  font-family:var(--f-key);font-weight:700;font-size:clamp(20px,3.8vw,54px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.6vh;padding:0;min-height:44px;transition:transform .06s}
.key::before{content:"";width:28%;max-width:34px;height:6px;border-radius:3px;background:#0f1216}
.key.lit::before{background:var(--led);box-shadow:0 0 10px var(--led)}
.key:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.side{display:flex;flex-direction:column;gap:1.2vw;width:clamp(110px,14vw,200px)}
.master{flex:1;appearance:none;border:2px solid var(--key-edge);border-radius:12px;background:var(--key);color:var(--ink);
  font-family:var(--f-key);font-weight:700;letter-spacing:.12em;font-size:clamp(18px,2.6vw,36px);min-height:44px}
.master.lit{border-color:var(--led);box-shadow:inset 0 0 0 2px var(--led)}
.foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:clamp(10px,1.1vw,14px);color:var(--dim)}
.flash{opacity:0;transition:opacity .4s}
.flash.show{opacity:1}
/* Patch-vindue */
.sheet{position:fixed;inset:0;background:rgba(5,7,10,.78);display:flex;align-items:center;justify-content:center;z-index:5}
.patch{background:var(--panel);border:2px solid var(--key-edge);border-radius:14px;padding:2.4vh 2.4vw;display:grid;gap:1.6vh;
  width:min(620px,92vw);animation:popin .25s ease-out 1}
.patch h2{margin:0;font-weight:700;letter-spacing:.1em;font-size:clamp(26px,3.6vw,48px);line-height:1.05}
.patch .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:clamp(12px,1.4vw,18px);color:var(--dim)}
.addr{font-family:var(--f-mono);font-size:clamp(48px,9vw,120px);text-align:center;color:var(--led);background:#05080c;border:1px solid var(--key-edge);
  border-radius:8px;text-align:right;padding:.6vh 1.2vw;min-height:1.2em;letter-spacing:.06em}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1vw}
.pad button{appearance:none;border:2px solid var(--key-edge);border-radius:10px;background:var(--key);color:var(--ink);
  font-family:var(--f-key);font-weight:700;font-size:clamp(22px,3.2vw,42px);min-height:48px;height:clamp(48px,7vh,80px)}
.pad .go{background:var(--led);border-color:var(--led);color:#05080c}
/* Pop-up beskeder – store nok til at kunne læses på film */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:auto;cursor:pointer;
  font-family:var(--f-key);font-weight:700;letter-spacing:.08em;text-align:center;line-height:1.05;
  font-size:clamp(34px,6.4vw,92px);padding:2.4vh 3vw;border-radius:16px;background:#0b0e12;border:4px solid var(--led);color:var(--ink);
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:88vw;animation:popin .28s cubic-bezier(.2,1.4,.4,1) 1}
.toast small{display:block;font-family:var(--f-mono);font-weight:500;letter-spacing:0;font-size:.36em;color:var(--dim);margin-top:.5em}
.toast.warn{border-color:var(--red);color:#ffd9d6}
.toast.ok{border-color:var(--ok);color:#d6ffe6}
.toast.pinkt{border-color:var(--pink);color:#ffd6ec}
@keyframes popin{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.patch{position:relative}
/* Advarsel, der overtager skærmen */
.alarm{position:fixed;inset:0;background:var(--alarm);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2vh;z-index:10;border:1.2vw solid var(--red);box-sizing:border-box;animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{border-color:var(--red)}to{border-color:#5a0a08}}
.alarm .big{font-family:var(--f-key);font-weight:700;font-size:clamp(90px,24vw,320px);line-height:.85;color:var(--red)}
.alarm .t1{font-family:var(--f-key);font-weight:700;letter-spacing:.14em;font-size:clamp(24px,4.6vw,64px);text-align:center}
.alarm .t2{font-family:var(--f-mono);font-size:clamp(12px,1.8vw,24px);color:#f3b3ae}
@media (max-width:640px){
  .rig{grid-template-columns:repeat(7,minmax(0,1fr))}
  .keys{grid-template-columns:repeat(5,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
  .side{width:auto;flex-direction:row}
  body{overflow:auto}
}
@media (prefers-reduced-motion:reduce){.alarm{animation:none}}
</style>

</head>
<body>
<div class="desk">
  <div class="top">
    <div class="brand" id="brand">BAGSCENEN · LYS</div>
    <div class="screen"><div><span>SCENE</span> GENERALPRØVE</div><div id="msg"></div><div><span>LAMPER</span> <b id="count">0</b>/13</div></div>
  </div>

  <div class="rig" id="rig" aria-label="Lamper – tryk for at tildele kanal"></div>

  <div class="board">
    <div class="left">
      <div class="pager">
        <button class="pg" id="prev" type="button" aria-label="Forrige side">◀</button>
        <span id="pageLbl"></span>
        <button class="pg" id="next" type="button" aria-label="Næste side">▶</button>
      </div>
      <div class="keys" id="keys"></div>
    </div>
    <div class="side">
      <button class="master" id="master" type="button">MASTER</button>
      <button class="master" id="black" type="button">SLUK</button>
    </div>
  </div>

  <div class="foot"><span>512 kanaler · tryk på en lampe for at tildele kanal</span><span class="flash" id="flash">● NULSTILLET</span></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="patch" role="dialog" aria-labelledby="pTitle">
    <h2 id="pTitle">LAMPE 13 · TAST KODE</h2>
    <div class="row"><span>LED PAR · RGB</span><span id="pState">IKKE TILDELT</span></div>
    <div class="addr" id="addr"></div>
    <div class="pad" id="pad">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button" data-k="del">SLET</button><button type="button">0</button><button type="button" data-k="ok" class="go">OK</button>
    </div>
    <button type="button" class="pg" id="close" style="width:auto;padding-inline:1.4em;justify-self:start">LUK</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="alarm" id="alarm" hidden>
  <div class="big" id="aBig">13</div>
  <div class="t1" id="aT1">ADRESSE 13 ER BLOKERET</div>
  <div class="t2" id="aT2">Kan ikke tildeles</div>
</div>

<script>
(function(){
  // Lampe 1–12 ligger på kanal 1–12 og virker. Lampe 13 har ingen kanal og lyser lyserødt, så snart pulten starter. Kanal 13 er blokeret.
  // Lampe 13 kan tildeles en hvilken som helst ledig kanal (14–512) – bare ikke 13.
  var LAMPS = 13, PER = 20, CHANNELS = 512, PAGES = Math.ceil(CHANNELS / PER), PINK = 12;
  var on, page, patch13, entry;
  var rig = document.getElementById("rig"), keys = document.getElementById("keys"), msg = document.getElementById("msg");
  var lamps = [], btns = [];

  for (var i = 1; i <= LAMPS; i++) {
    var l = document.createElement("button"); l.type = "button"; l.className = "lamp"; l.dataset.lamp = i;
    l.innerHTML = '<div class="bulb"></div><b>' + i + '</b><i></i>';
    rig.appendChild(l); lamps.push(l);
  }
  for (var k = 0; k < PER; k++) {
    var b = document.createElement("button"); b.type = "button"; b.className = "key";
    keys.appendChild(b); btns.push(b);
  }

  function works13(){ return patch13 >= 14; }
  function lampFor(ch){
    if (ch >= 1 && ch <= 12) return ch - 1;
    if (ch === patch13 && works13()) return PINK;
    return -1;
  }
  var msgT = null;
  var toast = document.getElementById("toast");
  function say(t, cls, sub){
    msg.textContent = t; msg.className = cls === "pinkt" ? "ok" : (cls || "");
    toast.className = "toast " + (cls || "");
    toast.innerHTML = t + (sub ? "<small>" + sub + "</small>" : "");
    toast.hidden = false; void toast.offsetWidth; toast.style.animation = "none"; void toast.offsetWidth; toast.style.animation = "";
    clearTimeout(msgT); msgT = setTimeout(function(){ msg.textContent = ""; toast.hidden = true; }, 2200);
  }
  // Et tryk på en pop-up lukker den – og når ikke igennem til knapperne bagved.
  ["pointerdown","click"].forEach(function(ev){
    toast.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); if (ev === "click") { clearTimeout(msgT); toast.hidden = true; } });
  });
  ["pointerdown"].forEach(function(ev){
    document.getElementById("alarm").addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); });
  });
  function popLamp(){ var l = lamps[PINK]; l.classList.remove("pop"); void l.offsetWidth; l.classList.add("pop"); }
  function render(){
    var c = 0;
    for (var i = 0; i < LAMPS; i++) {
      var x = i === PINK ? (!works13() || !!on[PINK]) : !!on[i];   // uden kanal lyser lampe 13 altid
      lamps[i].classList.toggle("on", x && i !== PINK);
      lamps[i].classList.toggle("pink", x && i === PINK);
      lamps[i].classList.remove("dead");
      lamps[i].querySelector("i").textContent = i === PINK ? (patch13 ? "KANAL " + patch13 : "KANAL –") : "KANAL " + (i + 1);
      if (x) c++;
    }
    for (var k = 0; k < PER; k++) {
      var ch = page * PER + k + 1;
      btns[k].textContent = ch; btns[k].dataset.ch = ch; btns[k].hidden = ch > CHANNELS;
      var li = lampFor(ch);
      btns[k].classList.toggle("lit", li >= 0 && !!on[li]);
    }
    document.getElementById("pageLbl").innerHTML = "SIDE <b>" + (page + 1) + "</b>/" + PAGES + " · KANAL " + (page * PER + 1) + "–" + Math.min(CHANNELS, (page + 1) * PER);
    document.getElementById("count").textContent = c;
    document.getElementById("master").classList.toggle("lit", c === LAMPS);
    document.getElementById("pState").textContent = works13() ? "KANAL " + patch13 : "IKKE TILDELT";
    document.getElementById("pState").style.color = works13() ? "var(--ok)" : "var(--red)";
  }
  function reset(){
    on = []; page = 0; patch13 = 0; entry = ""; unlocked = false;
    msg.textContent = ""; toast.hidden = true; document.getElementById("alarm").hidden = true; document.getElementById("sheet").hidden = true;
    render();
    var f = document.getElementById("flash"); f.classList.add("show");
    setTimeout(function(){ f.classList.remove("show"); }, 1500);
  }

  var alarmT = null;
  function alarm(big, t1, t2){
    document.getElementById("aBig").textContent = big;
    document.getElementById("aT1").textContent = t1;
    document.getElementById("aT2").textContent = t2;
    var a = document.getElementById("alarm"); a.hidden = false;
    clearTimeout(alarmT); alarmT = setTimeout(function(){ a.hidden = true; }, 2800);
  }
  document.getElementById("alarm").addEventListener("click", function(){ this.hidden = true; });

  // Kanalknapper
  keys.addEventListener("click", function(e){
    var b = e.target.closest(".key"); if (!b) return;
    var ch = +b.dataset.ch, li = lampFor(ch);
    if (ch === 13) { alarm("13", "KANAL 13 ER BLOKERET", "Kan ikke bruges"); return; }
    if (li < 0) { say("KANAL " + ch, "warn", "ingen lampe"); return; }
    on[li] = !on[li]; render();
  });
  document.getElementById("prev").addEventListener("click", function(){ page = (page + PAGES - 1) % PAGES; render(); });
  document.getElementById("next").addEventListener("click", function(){ page = (page + 1) % PAGES; render(); });
  document.getElementById("master").addEventListener("click", function(){
    for (var i = 0; i < LAMPS; i++) on[i] = true;
    if (!works13()) say("LAMPE 13", "warn", "har ingen kanal");
    render();
  });
  document.getElementById("black").addEventListener("click", function(){
    on = []; if (!works13()) say("LAMPE 13 SVARER IKKE", "warn"); render();
  });

  // Patch – lampe 13 er låst med en kode, før den kan få en kanal
  // Standardkode = lampenummer to gange (0101, 0202 …). For lampe 13 ville det være 1313 – men 13 er blokeret.
  var CODE = "1414", unlocked = false;
  var sheet = document.getElementById("sheet"), addr = document.getElementById("addr"), title = document.getElementById("pTitle");
  function showEntry(){
    if (!unlocked) { addr.textContent = entry ? entry.replace(/./g, "●") + "○○○○".slice(entry.length) : "○○○○"; return; }
    addr.textContent = entry || (patch13 ? patch13 : "–");
  }
  function openSheet(){
    entry = "";
    title.textContent = unlocked ? "LAMPE 13 · VÆLG KANAL" : "LAMPE 13 · TAST KODE";
    showEntry(); render(); sheet.hidden = false;
  }
  lamps.forEach(function(l){
    l.addEventListener("click", function(){
      var n = +l.dataset.lamp;
      if (n !== 13) { say("LAMPE " + n, "", "kanal " + n + " · kode " + ("0" + n).slice(-2) + ("0" + n).slice(-2)); return; }
      openSheet();
    });
  });
  document.getElementById("close").addEventListener("click", function(){ sheet.hidden = true; });
  document.getElementById("pad").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    var k = b.dataset.k;
    if (k === "del") { entry = entry.slice(0, -1); showEntry(); return; }
    if (!unlocked) {
      if (k !== "ok") { if (entry.length < 4) entry += b.textContent; showEntry(); }
      if (k === "ok" || entry.length === 4) {
        var c = entry; entry = "";
        if (c === CODE) { unlocked = true; openSheet(); say("LÅST OP", "ok", "vælg en kanal"); return; }
        if (c.indexOf("13") >= 0) { alarm("13", "13 ER BLOKERET", "Kan ikke bruges"); showEntry(); return; }
        if (c.length) say("FORKERT KODE", "warn", c);
        showEntry();
      }
      return;
    }
    if (k !== "ok") { if (entry.length < 3) entry += b.textContent; showEntry(); return; }
    var n = parseInt(entry, 10); entry = "";
    if (!n || n > CHANNELS) { say("UGYLDIG KANAL", "warn"); showEntry(); return; }
    if (n === 13) { alarm("13", "KANAL 13 ER BLOKERET", "Kan ikke tildeles"); showEntry(); return; }
    if (n <= 12) { say("KANAL " + n + " ER OPTAGET", "warn", "bruges af lampe " + n); showEntry(); return; }
    patch13 = n; on[PINK] = true; sheet.hidden = true; say("KANAL " + n, "pinkt", "lampe 13 svarer"); popLamp();
    showEntry(); render();
  });

  // Skjult nulstilling til næste take: tryk tre gange hurtigt på "BAGSCENEN · LYS" (eller tast R).
  var taps = 0, timer = null;
  document.getElementById("brand").addEventListener("click", function(){
    taps++; clearTimeout(timer); timer = setTimeout(function(){ taps = 0; }, 600);
    if (taps >= 3) { taps = 0; reset(); }
  });
  document.addEventListener("keydown", function(e){ if (e.key === "r" || e.key === "R") reset(); });

  document.addEventListener("pointerdown", function once(){
    document.removeEventListener("pointerdown", once);
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(function(){}); } catch(e){}
  });

  // Fuld skærm: tryk på displayet øverst til højre.
  document.querySelector(".screen").addEventListener("click", function(){
    var d = document.documentElement, fs = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (fs) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else if (d.requestFullscreen) { d.requestFullscreen().catch(function(){}); }
      else if (d.webkitRequestFullscreen) { d.webkitRequestFullscreen(); }
    } catch(e){}
  });

  reset();
})();
</script>

</body>
</html>
